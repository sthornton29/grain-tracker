name: CI

# Run lint + unit tests on every push and PR so a broken formula or lint error
# can't silently land. The tests cover the money-critical pure logic in lib/.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
